#     https://github.com/dockur/casa                                  #
#---------------------------------------------------------------------#
services:
  casa:
    image: dockurr/casa
    container_name: casa
    ports:
      - 7070:8080
    volumes:
      - ./casa:/DATA
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
    stop_grace_period: 1m
