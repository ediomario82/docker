services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    ports:
      - "8642:8642"   # gateway API
      - "9119:9119"   # dashboard (only reached when HERMES_DASHBOARD=1)
    volumes:
      - /mnt/hermes:/opt/data
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=seunome
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=suasenha
      - NVIDIA_API_KEY=sua_api
      - TELEGRAM_BOT_TOKEN=123456:AAH0SekFkc3srZI-c_GQyfypNd_-2RTdyjA
      - TELEGRAM_ALLOWED_USERS=40781054321  # seus IDs do Telegram (use /whoami no bot para descobrir)
      # Uncomment to forward specific env vars instead of using .env file:
      # - ANTNAHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      # - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "3.0"
# https://build.nvidia.com/settings/api-keys
